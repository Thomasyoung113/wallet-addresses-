name: Faucet Claim

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Claim faucet for all wallets
        run: |
          LOG="faucet_results.csv"
          echo "address,http_status,response" > "$LOG"
          batch=()
          count=0
          total=0
          while IFS= read -r addr; do
            [ -z "$addr" ] && continue
            batch+=("$addr")
            if [ ${#batch[@]} -eq 20 ]; then
              ((count++))
              total=$((total + 20))
              echo "Batch $count: 20 wallets (total: $total)"
              for a in "${batch[@]}"; do
                (
                  resp=$(curl -s -w "\n%{http_code}" -X POST https://api.convallax.com/faucet \
                    -H "Content-Type: application/json" \
                    -d "{ \"wallet\": \"$a\" }")
                  s=$(echo "$resp" | tail -n1)
                  b=$(echo "$resp" | sed '$d' | tr -d '\n' | tr ',' ';')
                  echo "$a,$s,\"$b\"" >> "$LOG"
                  echo "  [$a] -> $s"
                ) &
              done
              wait
              batch=()
              sleep 3
            fi
          done < addresses.txt
          if [ ${#batch[@]} -gt 0 ]; then
            ((count++))
            total=$((total + ${#batch[@]}))
            echo "Batch $count: ${#batch[@]} wallets (total: $total)"
            for a in "${batch[@]}"; do
              (
                resp=$(curl -s -w "\n%{http_code}" -X POST https://api.convallax.com/faucet \
                  -H "Content-Type: application/json" \
                  -d "{ \"wallet\": \"$a\" }")
                s=$(echo "$resp" | tail -n1)
                b=$(echo "$resp" | sed '$d' | tr -d '\n' | tr ',' ';')
                echo "$a,$s,\"$b\"" >> "$LOG"
                echo "  [$a] -> $s"
              ) &
            done
            wait
          fi
          echo "=== Done. $count batches, $total wallets ==="
          awk -F',' 'NR>1 {print $2}' "$LOG" | sort | uniq -c | sort -rn
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: faucet-results
          path: faucet_results.csv